spring:
  application:
    name: sensitive-words-service

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SensitiveWordsHikariPool

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    show-sql: ${DB_SHOW_SQL:false}

  server:
    port: ${SERVER_PORT:8080}

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,loggers,httptrace
    endpoint:
      health:
        show-details: always

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

jwt:
  secret: my-secret-key-for-jwt-token-generation-min-256-bits
  expiration: 120000

logging:
  level:
    com.joseph.sensitivewordsservice: INFO
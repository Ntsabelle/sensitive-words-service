services:
  redis:
    image: redis:7-alpine
    container_name: sensitive-words-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sensitive-words-network
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sensitive-words-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD before starting the stack}
      DB_NAME: ${DB_NAME:?Set DB_NAME before starting the stack}
      DB_USER: ${DB_USER:?Set DB_USER before starting the stack}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}
      MSSQL_PID: "Developer"
      MSSQL_TCP_PORT: "1433"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./docker/init-db.sh:/tmp/init-db.sh:ro
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        bash /tmp/init-db.sh
        wait
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "${DB_USER:?Set DB_USER before starting the stack}", "-P", "${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}", "-d", "${DB_NAME:?Set DB_NAME before starting the stack}", "-Q", "SELECT 1", "-b"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - sensitive-words-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensitive-words-app
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://mssql:1433;databaseName=${DB_NAME:?Set DB_NAME before starting the stack};encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_DRIVER: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Set DB_USER before starting the stack}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_USER: ${DB_USER:?Set DB_USER before starting the stack}
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the stack}
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.SQLServerDialect"
      SPRING_H2_CONSOLE_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the stack}
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mssql:
        condition: service_healthy
    networks:
      - sensitive-words-network
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  sensitive-words-network:
    driver: bridge

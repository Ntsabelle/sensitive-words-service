version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sensitive-words-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sensitive-words-network
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sensitive-words-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-ChangeMe@1234}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD:-ChangeMe@1234}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensitive-words-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sensitive-words-app
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://mssql:1433;databaseName=SensitiveWordsDB;encrypt=false;trustServerCertificate=true"
      SPRING_DATASOURCE_DRIVER: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: ${SA_PASSWORD:-ChangeMe@1234}
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-must-set-environment-variable}
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mssql:
        condition: service_healthy
    networks:
      - sensitive-words-network
    restart: unless-stopped

volumes:
  mssql_data:

networks:
  sensitive-words-network:
    driver: bridge

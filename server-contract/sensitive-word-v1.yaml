openapi: 3.0.3
info:
  title: Sensitive Words Service
  description: >
    API for managing a list of sensitive/profane words and sanitizing text
    against that list. Secured with JWT authentication.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Authentication
  - name: Sensitive Words
  - name: Sanitize
  - name: Health & Info

paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              username: admin
              password: password123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and obtain a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              username: admin
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sensitive-words:
    get:
      tags: [Sensitive Words]
      summary: List all sensitive words (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          example: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
          example: 20
      responses:
        '200':
          description: Paginated list of sensitive words
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveWordPage'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Sensitive Words]
      summary: Create a new sensitive word
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensitiveWordRequest'
            example:
              word: badword
              category: profanity
              severity: HIGH
      responses:
        '201':
          description: Word created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveWord'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sensitive-words/{id}:
    get:
      tags: [Sensitive Words]
      summary: Get a sensitive word by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WordId'
      responses:
        '200':
          description: The requested word
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveWord'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Word not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Sensitive Words]
      summary: Update a sensitive word
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensitiveWordRequest'
            example:
              word: updatedword
              category: profanity
              severity: MEDIUM
      responses:
        '200':
          description: Word updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveWord'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Word not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Sensitive Words]
      summary: Delete a sensitive word
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WordId'
      responses:
        '204':
          description: Word deleted
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Word not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sanitize:
    post:
      tags: [Sanitize]
      summary: Sanitize text against the sensitive words list
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanitizeRequest'
            example:
              text: This is a badword text that needs sanitization
      responses:
        '200':
          description: Sanitized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanitizeResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /actuator/health:
    get:
      tags: [Health & Info]
      summary: Service health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v3/api-docs:
    get:
      tags: [Health & Info]
      summary: Raw OpenAPI document served by the running application
      responses:
        '200':
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WordId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1

  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: password123

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        tokenType:
          type: string
          example: Bearer

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: User registered successfully

    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    SensitiveWordRequest:
      type: object
      required: [word, category, severity]
      properties:
        word:
          type: string
          example: badword
        category:
          type: string
          example: profanity
        severity:
          $ref: '#/components/schemas/Severity'

    SensitiveWord:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/SensitiveWordRequest'

    SensitiveWordPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SensitiveWord'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3

    SanitizeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          example: This is a badword text that needs sanitization

    SanitizeResponse:
      type: object
      properties:
        original:
          type: string
          example: This is a badword text that needs sanitization
        sanitized:
          type: string
          example: This is a ******* text that needs sanitization
        matchedWords:
          type: array
          items:
            type: string
          example: ["badword"]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        path:
          type: string
          example: /api/v1/sensitive-words

security:
  - bearerAuth: []